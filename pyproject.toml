[project]
name = "ats-service"
version = "0.1.0"
description = "PDF parser for the ATS check"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdfminer-six>=20260107",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.uv]
required-version = ">=0.12.21"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]
