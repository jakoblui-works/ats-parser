name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/jakoblui-works/ats-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: >
          docker run --rm \
            -e REDIS__PASSWORD=x \
            -e DATABASE__PASSWORD=x \
            -e S3__ACCESS_KEY_ID=x \
            -e S3__SECRET_ACCESS_KEY=x \
            -e S3__BUCKET=x \
            ghcr.io/jakoblui-works/ats-service:${{ github.sha }} \
            python -u -c 'import importlib, pkgutil, app; [print(m.name) or importlib.import_module(m.name) for m in pkgutil.walk_packages(app.__path__, "app.")]'
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jakoblui-works/ats-service:${{ github.sha }}
            ghcr.io/jakoblui-works/ats-service:latest
          cache-from: type=gha
      # infra replaces this with the deploy's result, on this commit.
      - name: Mark the commit as waiting to deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=deploy -f description="Waiting to deploy"
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/jakoblui-works/infra/dispatches -f event_type=deploy \
            -f 'client_payload[repo]=ats-service' -f "client_payload[sha]=$GITHUB_SHA"
