name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the project's version (.python-version); 3.14 is Pyodide 314.x's Python, which the site runs.
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - name: Build the wheel (3.13 only)
        if: matrix.python-version == '3.13'
        run: uv build
      - name: Smoke-test the built wheel on its own
        if: matrix.python-version == '3.13'
        run: |
          set -euo pipefail
          wheels=(dist/ats_parser-*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "Expected one wheel in dist/, found: ${wheels[*]}" >&2; exit 1; }
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          uv run --locked python -c "from pathlib import Path; from tests.ats import samples; Path('$smoke/clean.pdf').write_bytes(samples.clean_pdf())"
          cat > "$smoke/check.py" <<'PY'
          import importlib.resources
          import json
          import sys
          from pathlib import Path

          import ats_parser

          package = importlib.resources.files("ats_parser")
          assert "site-packages" in str(package), f"not the installed wheel: {package}"
          assert package.joinpath("py.typed").is_file(), "py.typed is missing from the installed package"
          outcome = json.loads(ats_parser.parse_pdf_json(Path(sys.argv[1]).read_bytes()))["outcome"]
          assert outcome == "parsed", f"sample CV gave outcome {outcome!r}"
          print("installed wheel parsed the sample:", package)
          PY
          uv venv --python 3.13 "$smoke/venv"
          uv pip install --python "$smoke/venv/bin/python" "${wheels[0]}"
          cd "$smoke"
          "$smoke/venv/bin/python" -I check.py "$smoke/clean.pdf"
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.13'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Tag must match the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match pyproject version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/ats_parser-${VERSION}-py3-none-any.whl" \
            schema/parse_outcome.schema.json \
            --title "$TAG" --verify-tag --generate-notes
